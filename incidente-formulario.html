<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescateVial | Formulario de incidente</title>
  <link rel="stylesheet" href="src/css/incidente-formulario.css">
</head>
<body>
  <div id="site-nav"></div>
  <main class="contenedor">
    <h1 id="titulo-formulario">Agregar incidente</h1>
    <p id="mensaje" role="status"></p>
    <form id="formulario-incidente">
      <label for="descripcion">Descripción</label>
      <input id="descripcion" name="descripcion" required>
      <label for="latitud">Latitud</label>
      <input id="latitud" name="latitud" type="number" min="-90" max="90" step="any" required>
      <label for="longitud">Longitud</label>
      <input id="longitud" name="longitud" type="number" min="-180" max="180" step="any" required>
      <label for="prioridad">Prioridad</label>
      <input id="prioridad" name="prioridad" list="prioridades" required>
      <datalist id="prioridades"><option value="ALTA"><option value="MEDIA"><option value="BAJA"></datalist>
      <label for="estado">Estado</label>
      <input id="estado" name="estado" list="estados-incidente" required>
      <datalist id="estados-incidente"><option value="PENDIENTE"></datalist>
      <label for="usuarioId">ID del usuario</label>
      <input id="usuarioId" name="usuarioId" type="number" min="1" step="1" required>
      <label for="tipoIncidenteId">ID del tipo de incidente</label>
      <input id="tipoIncidenteId" name="tipoIncidenteId" type="number" min="1" step="1" required>
      <button class="boton" type="submit">Guardar incidente</button>
      <a href="incidentes.html">Cancelar</a>
    </form>
  </main>
  <script type="module" src="src/js/incidente-formulario.js"></script>
</body>
</html>
