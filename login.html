<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescateVial | Iniciar sesión</title>
    <link rel="stylesheet" href="src/css/login.css">
</head>
<body>
    <header class="login-header">
  <div class="login-brand" href="index.html">
    <img src="src/img/rescatevial-logo.png" alt="">
    <span>
      <strong>RescateVial</strong>
      <small>Atención rápida. Apoyo en el camino.</small>
    </span>
</div>
</header>
    <main>
        <section>
            <h1>Iniciar sesión</h1>
            <form>
                <label for="username">Correo:</label>
                <input type="email" id="username" name="email" autocomplete="username" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                
                <button type="submit">Iniciar sesión</button>
            </form>
            <p id="mensaje-login" role="status"></p>
            <p>¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
            <a href="index.html">Volver a la portada</a>
       
        </section>

    </main>


    <script type="module" src="src/js/login.js"></script>
</body>
</html>
