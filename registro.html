<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RescateVial | Crear cuenta</title>
  <link rel="stylesheet" href="src/css/registro.css">
</head>
<body>
  <header class="login-header"><a class="login-brand" href="index.html"><img src="src/img/rescatevial-logo.png" alt=""><span><strong>RescateVial</strong><small>Atención rápida. Apoyo en el camino.</small></span></a></header>
  <main><section>
    <h1>Crear cuenta</h1>
    <p>Completa tus datos para crear una cuenta.</p>
    <form id="form-registro">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="name" autocomplete="name" required>
      <label for="correo">Correo</label>
      <input id="correo" name="email" type="email" autocomplete="email" required>
      <label for="clave">Contraseña</label>
      <input id="clave" name="password" type="password" autocomplete="new-password" minlength="6" required>
      <label for="rol">Tipo de cuenta</label>
      <select id="rol" name="role" required>
        <option value="">Selecciona una opción</option>
        <option value="ciudadano">Ciudadano</option>
        <option value="operador">Operador</option>
      </select>
      <button type="submit">Crear cuenta</button>
    </form>
    <p id="mensaje-registro" role="status" aria-live="polite"></p>
    <p>¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
  </section></main>
  <script type="module" src="src/js/registro.js"></script>
</body>
</html>
